<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3d5c">
<title>SkyMonitor – live lietadlá</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #map { height: 100%; width: 100%; }

  /* hlavička: dva riadky, žiadne prekryvy, všetko klikateľné */
  .topbar {
    position: absolute; top: 10px; left: 10px; right: 10px; z-index: 1000;
    display: flex; flex-direction: column; gap: 8px; align-items: stretch;
  }
  .toprow, .searchrow { display: flex; gap: 8px; align-items: center; }
  .toprow .brand { flex: none; }
  .toprow .status { flex: 1 1 auto; min-width: 0; justify-content: center; }
  .toprow .status #status { display: block; overflow: hidden; text-overflow: ellipsis; }
  .searchrow input[type="search"] { flex: 1 1 auto; max-width: 420px; min-width: 0; }

  .brand {
    display: flex; align-items: center; gap: 10px;
    background: rgba(11,61,92,.92); color: #fff;
    padding: 10px 16px; border-radius: 12px;
    font-weight: 700; font-size: 16px; letter-spacing: .3px;
    box-shadow: 0 4px 14px rgba(0,0,0,.25);
    backdrop-filter: blur(6px);
  }
  .brand svg { width: 20px; height: 20px; flex: none; }
  .brand small { font-weight: 400; opacity: .75; font-size: 10.5px; display: block; margin-top: -2px; letter-spacing: 0; }

  .topbar input[type="search"] {
    padding: 11px 14px; font-size: 15px;
    border: none; border-radius: 12px; outline: none;
    box-shadow: 0 4px 14px rgba(0,0,0,.25);
    background: rgba(255,255,255,.96);
  }
  .topbar input[type="search"]:focus { box-shadow: 0 0 0 3px rgba(30,115,200,.5); }

  .toggle {
    display: flex; align-items: center; gap: 7px;
    background: rgba(255,255,255,.92); padding: 11px 14px; border-radius: 12px;
    font-size: 13.5px; cursor: pointer; user-select: none; white-space: nowrap;
    box-shadow: 0 4px 14px rgba(0,0,0,.25);
  }
  .toggle input { accent-color: #0b3d5c; width: 16px; height: 16px; }

  .status {
    background: rgba(11,61,92,.92); color: #fff;
    padding: 10px 14px; border-radius: 12px; font-size: 13px;
    box-shadow: 0 4px 14px rgba(0,0,0,.25); backdrop-filter: blur(6px);
    display: flex; align-items: center; gap: 8px; white-space: nowrap;
  }
  .status .pulse {
    width: 8px; height: 8px; border-radius: 50%; background: #4ade80;
    animation: pulse 2s infinite; flex: none;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(74,222,128,.6); }
    70%  { box-shadow: 0 0 0 7px rgba(74,222,128,0); }
    100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); }
  }

  /* plynulý pohyb lietadiel medzi obnoveniami; počas zoomu vypnuté */
  #map:not(.zooming) .plane-icon { transition: transform 1.3s linear; }
  #map.zooming .plane-icon { transition: none; }
  .plane-icon { display: flex; align-items: center; justify-content: center; }
  .plane-popup { font-size: 13px; line-height: 1.55; min-width: 210px; }
  .plane-popup b { color: #0b3d5c; font-size: 14px; }
  .plane-popup small { color: #667; }

  /* detailný panel lietadla (bottom sheet) */
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 1500;
    display: flex; justify-content: center;
    transform: translateY(110%);
    transition: transform .28s ease;
    pointer-events: none;
  }
  .sheet.open { transform: translateY(0); pointer-events: auto; }
  .sheet-card {
    background: #fff; width: 100%; max-width: 560px;
    border-radius: 18px 18px 0 0;
    box-shadow: 0 -6px 30px rgba(0,0,0,.3);
    padding: 14px 16px calc(16px + env(safe-area-inset-bottom));
    max-height: 62vh; overflow: auto;
  }
  .sheet-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
  .sheet-title { font-size: 22px; font-weight: 800; color: #0b3d5c; letter-spacing: .5px; line-height: 1.1; }
  .sheet-sub { font-size: 13px; color: #667; margin-top: 3px; }
  .sheet-close { border: none; background: #eef2f6; width: 34px; height: 34px; border-radius: 10px; font-size: 15px; cursor: pointer; color: #334; flex: none; }
  .routeline {
    background: #eaf1f8; color: #0b3d5c; font-weight: 700;
    border-radius: 10px; padding: 10px 12px; font-size: 14px;
    margin-bottom: 8px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  }
  .routeline .arrow { color: #1e73c8; font-weight: 800; }
  .alert { background: #fdecea; color: #b71c1c; padding: 8px 12px; border-radius: 8px; font-weight: 700; margin-bottom: 8px; font-size: 13px; }
  .sheet-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 10px 0; }
  .cell { background: #f4f7fa; border-radius: 10px; padding: 8px 10px; }
  .cell span { display: block; font-size: 10.5px; color: #789; text-transform: uppercase; letter-spacing: .4px; }
  .cell b { font-size: 14px; color: #0b3d5c; white-space: nowrap; }
  .sheet-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .btn {
    flex: 1 1 auto; padding: 11px 12px; border: none; border-radius: 10px;
    background: #0b3d5c; color: #fff; font-size: 13.5px; font-weight: 600;
    cursor: pointer; text-decoration: none; text-align: center;
  }
  .btn:active { opacity: .85; }
  .btn.on { background: #14532d; }
  .btn.fav { background: #f5b301; color: #3a2a00; }
  .btn.fav.on { background: #b8860b; color: #fff; }
  .btn.ghost { background: #eef2f6; color: #0b3d5c; }
  .sheet-foot { font-size: 11.5px; color: #8899a6; margin-top: 10px; }

  .plane-icon svg { width: 30px; height: 30px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }

  @media (max-width: 480px) {
    .sheet-grid { grid-template-columns: repeat(2, 1fr); }
  }

  .legend {
    position: absolute; bottom: 12px; right: 12px; z-index: 1000;
    background: rgba(255,255,255,.93); border-radius: 12px; padding: 9px 13px;
    font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.25);
  }
  .legend span.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }

  .diagbtn {
    display: flex; align-items: center; justify-content: center;
    width: 44px; height: 44px; font-size: 17px; flex: none;
    background: rgba(255,255,255,.92); border: none; border-radius: 12px;
    cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.25);
  }
  .diagbtn:hover { background: #fff; }

  #diagPanel {
    position: fixed; inset: 0; z-index: 2000;
    background: rgba(0,0,0,.45);
    display: none; align-items: center; justify-content: center;
    padding: 16px;
  }
  .diagcard {
    background: #fff; border-radius: 14px; max-width: 480px; width: 100%;
    max-height: 80vh; overflow: auto; box-shadow: 0 12px 40px rgba(0,0,0,.4);
    font-size: 13px; line-height: 1.6;
  }
  .diaghead {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; border-bottom: 1px solid #eee;
    font-weight: 700; color: #0b3d5c; position: sticky; top: 0; background: #fff;
  }
  .diaghead button { border: none; background: none; font-size: 16px; cursor: pointer; color: #666; }
  #diagOut { padding: 14px 16px; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .diagfoot { padding: 12px 16px; border-top: 1px solid #eee; display: flex; gap: 8px; }
  .diagfoot button {
    flex: 1; padding: 9px; border: none; border-radius: 8px; background: #0b3d5c; color: #fff;
    font-size: 13px; cursor: pointer;
  }

  @media (max-width: 640px) {
    .brand small { display: none; }
    .brand { padding: 9px 12px; font-size: 15px; }
    .toggle { padding: 10px 12px; font-size: 12.5px; }
    .toprow .status { font-size: 12px; padding: 9px 10px; }
  }
</style>
</head>
<body>
<div id="map"></div>
<div class="topbar">
  <div class="toprow">
    <div class="brand">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path fill="#fff" d="M12 2 L13.2 9.5 L21 12 L13.2 14.2 L13.6 17.5 L15.5 19.5 L12 18.8 L8.5 19.5 L10.4 17.5 L10.8 14.2 L3 12 L10.8 9.5 Z"/>
      </svg>
      <span>SkyMonitor<small>live pozície lietadiel</small></span>
    </div>
    <div class="status"><span class="pulse"></span><span id="status">Načítavam…</span></div>
    <button class="diagbtn" title="Diagnostika zdrojov" onclick="window.__skyDiag()">🔧</button>
  </div>
  <div class="searchrow">
    <input id="search" type="search" placeholder="Hľadať lietadlo (callsign alebo hex)…" autocomplete="off">
    <label class="toggle"><input type="checkbox" id="hideground"> Skryť na zemi</label>
  </div>
</div>
<div id="sheet" class="sheet">
  <div class="sheet-card">
    <div class="sheet-head">
      <div>
        <div id="sheetTitle" class="sheet-title">–</div>
        <div id="sheetSub" class="sheet-sub">–</div>
      </div>
      <button class="sheet-close" onclick="window.__skySheetClose()">✕</button>
    </div>
    <div id="sheetBody"></div>
  </div>
</div>
<div class="legend">
  <span class="dot" style="background:#d43f3f"></span>nízko &nbsp;
  <span class="dot" style="background:#e08a1e"></span>stredne &nbsp;
  <span class="dot" style="background:#1e73c8"></span>vyššie &nbsp;
  <span class="dot" style="background:#fff;border:1px solid #999"></span>vybrané
</div>
<div id="diagPanel" onclick="if(event.target===this)window.__skyDiagClose()">
  <div class="diagcard">
    <div class="diaghead"><span>🔧 Diagnostika zdrojov</span><button onclick="window.__skyDiagClose()">✕</button></div>
    <div id="diagOut"></div>
    <div class="diagfoot">
      <button id="diagCopyBtn" onclick="window.__skyDiagCopy()">📋 Skopírovať výsledok</button>
      <button onclick="window.__skyDiag()">↻ Znova</button>
    </div>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/app.js"></script>
</body>
</html>
