name: Data backup (OpenSky)

on:
  schedule:
    - cron: '1-59/2 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Záložný update (OpenSky + stará cache, keď primárna je stará > 2 min)
        run: |
          OS_NORM='[.states[] | select(.[5] != null and .[6] != null and .[8] == false) | {hex: (.[0] | ascii_downcase), flight: (if .[1] == null then null else (.[1] | sub("\\s+$"; "")) end), r: null, t: null, mil: false, alt_baro: (if .[7] == null then null else (.[7] * 3.28084 | round) end), gs: (if .[9] == null then null else (.[9] * 1.94384 | round) end), track: .[10], baro_rate: (if .[11] == null then null else (.[11] * 196.85 | round) end), squawk: .[14], emergency: null, category: null, lat: .[6], lon: .[5], pt: (.[3] // null), src: "opensky"}] | sort_by(.hex, (.pt // -1)) | reduce .[] as $a ([]; if (length > 0) and (.[-1].hex == $a.hex) then .[-1] = $a else . + [$a] end)'
          BMERGE='[ .[0], (.[1].ac // []) ] | flatten | sort_by(.hex) | reduce .[] as $a ([]; if (length > 0) and (.[-1][0].hex == $a.hex) then .[-1] = (.[-1] + [$a]) else . + [[$a]] end) | map(sort_by(.pt // -1) | reverse) | map(.[0] as $b | {b: $b, v: (([.[] | select(.v != null)] | map(.v) | max) // 1), r: ([.[] | select(.r != null)] | if length > 0 then .[0].r else null end), t: ([.[] | select(.t != null)] | if length > 0 then .[0].t else null end), fl: ([.[] | select(.flight != null)] | if length > 0 then (.[0].flight | gsub("\\s"; "")) else null end), cat: ([.[] | select(.category != null)] | if length > 0 then .[0].category else null end), mil: (([.[] | select(.mil == true)] | length) > 0)}) | map({hex: .b.hex, flight: .fl, r: .r, t: .t, mil: .mil, alt_baro: .b.alt_baro, gs: .b.gs, track: .b.track, baro_rate: .b.baro_rate, squawk: .b.squawk, emergency: (.b.emergency // null), category: .cat, lat: .b.lat, lon: .b.lon, v: .v, pt: (.b.pt // null), src: (.b.src // "opensky")}) | {updated: (now|floor), ac: .}'
          NOW=$(date +%s)
          AGE=$(curl -sL --max-time 20 "https://raw.githubusercontent.com/petersoniq/skymonitor/data/data/sk.json" | jq -r '.updated // 0' 2>/dev/null || echo 0)
          if [ "$((NOW - AGE))" -lt 110 ]; then
            echo "primarna cache je cerstva ($(( (NOW - AGE) / 60 )) min), zaloha nie je potrebna"
            exit 0
          fi
          echo "primarna cache je stara $(( (NOW - AGE) / 60 )) min - spustam zalohu"
          OPENSKY_ID="${{ secrets.OPENSKY_CLIENT_ID }}"
          OPENSKY_SECRET="${{ secrets.OPENSKY_CLIENT_SECRET }}"
          rm -f old.json opensky.json hist.json newhist.json part-opensky.json sk.json
          curl -sL --max-time 20 "https://raw.githubusercontent.com/petersoniq/skymonitor/data/data/sk.json" -o old.json
          jq -e 'type == "object"' old.json > /dev/null 2>&1 || echo '{"ac":[]}' > old.json
          if [ -n "$OPENSKY_ID" ] && [ -n "$OPENSKY_SECRET" ]; then
            TOKEN=$(curl -s --max-time 15 -X POST \
              "https://auth.opensky-network.org/auth/realms/opensky-network/protocol/openid-connect/token" \
              -d "grant_type=client_credentials" \
              -d "client_id=$OPENSKY_ID" \
              -d "client_secret=$OPENSKY_SECRET" | jq -r '.access_token // empty')
            if [ -n "$TOKEN" ]; then
              curl -sL --max-time 40 -H "Authorization: Bearer $TOKEN" \
                "https://opensky-network.org/api/states/all?lamin=34&lomin=-12&lamax=62&lomax=32" -o opensky.json
            fi
          fi
          if ! jq -e '.states | length' opensky.json > /dev/null 2>&1; then
            echo "OpenSky zlyhal - nemenim cache"
            exit 0
          fi
          jq -c "$OS_NORM" opensky.json > part-opensky.json
          TOTAL_OS=$(jq 'length' part-opensky.json)
          if [ "$TOTAL_OS" -lt 10 ]; then
            echo "OpenSky: len $TOTAL_OS lietadiel - nemenim cache"
            exit 0
          fi
          jq -s -c "$BMERGE" part-opensky.json old.json > sk.json
          echo "OK: $(jq '.ac | length' sk.json) lietadiel (backup)"
          UPT=$(jq -r '.updated' sk.json)
          curl -sL --max-time 20 "https://raw.githubusercontent.com/petersoniq/skymonitor/data/data/hist.json" -o hist.json
          jq -e 'type == "object"' hist.json > /dev/null 2>&1 || echo '{}' > hist.json
          jq -c --argjson u "$UPT" --slurpfile o hist.json '[.ac[] | select(.lat != null) | {key: .hex, value: [[.lat, .lon, (.alt_baro | if . == "ground" then 0 else . end), $u]]}] | from_entries | to_entries | map(.key as $k | .value = ((($o[0][$k] // []) + .value)[-20:])) | from_entries' sk.json > newhist.json
          mv newhist.json hist.json
          mkdir repo && cd repo
          git init -q
          git config user.name "skymonitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -q -b data
          mkdir -p data
          cp ../sk.json data/sk.json
          cp ../hist.json data/hist.json
          git add -A
          git commit -qm "data (backup): $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/petersoniq/skymonitor.git" data
