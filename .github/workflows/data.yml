name: Data update (repo cache)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Stiahni lietadlá a ulož do vetvy data
        run: |
          rm -f part-*.json tmp.json
          n=0
          regions=0
          for c in "48.7 19.5" "48.11 16.57" "47.44 19.26" "50.1 14.26" "50.08 19.79" "52.17 20.97" "45.78 16.0" "46.05 14.5"; do
            lat=${c% *}
            lon=${c#* }
            got=0
            for src in "api.adsb.lol/v2" "opendata.adsb.fi/api/v2"; do
              for i in 1 2; do
                curl -sL --max-time 25 "https://$src/lat/$lat/lon/$lon/dist/250" -o tmp.json
                if jq -e '(.ac // .aircraft) | length' tmp.json > /dev/null 2>&1; then
                  got=1
                  break
                fi
                sleep 2
              done
              [ "$got" -eq 1 ] && break
            done
            if [ "$got" -eq 1 ]; then
              cp tmp.json "part-$n.json"
              n=$((n+1))
              regions=$((regions+1))
            fi
          done
          if [ "$n" -eq 0 ]; then
            echo "VAROVANIE: všetky zdroje zlyhali, zostáva stará cache"
            exit 0
          fi
          jq -s '[.[] | (.ac // .aircraft)] | flatten | map(select(.lat != null)) | unique_by(.hex) | {updated: (now|floor), ac: .}' part-*.json > sk.json
          echo "OK: $regions regionov, $(jq '.ac | length' sk.json) lietadiel"
          mkdir repo && cd repo
          git init -q
          git config user.name "skymonitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -q -b data
          mkdir -p data
          cp ../sk.json data/sk.json
          git add -A
          git commit -qm "data: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/petersoniq/skymonitor.git" data
