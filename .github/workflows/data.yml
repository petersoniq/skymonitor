name: Data update (repo cache)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      OPENSKY_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
      OPENSKY_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
    steps:
      - name: Stiahni lietadlá a ulož do vetvy data
        run: |
          rm -f part-*.json tmp.json
          n=0
          regions=0
          for c in "48.7 19.5" "48.11 16.57" "47.44 19.26" "50.1 14.26" "50.08 19.79" "52.17 20.97" "45.78 16.0" "46.05 14.5" "52.36 13.50" "48.35 11.79" "50.03 8.56" "47.46 8.55" "49.01 2.55" "52.31 4.76" "51.47 -0.45" "41.80 12.25" "45.63 8.72" "40.49 -3.57" "41.40 2.08" "55.62 12.66" "59.65 17.92" "44.57 26.09" "37.94 23.95" "60.19 11.10" "53.42 -6.27" "38.77 -9.13"; do
            lat=${c% *}
            lon=${c#* }
            got=0
            for src in "api.adsb.lol/v2" "opendata.adsb.fi/api/v2"; do
              for i in 1 2; do
                curl -sL --max-time 25 "https://$src/lat/$lat/lon/$lon/dist/250" -o tmp.json
                if jq -e '(.ac // .aircraft) | length' tmp.json > /dev/null 2>&1; then
                  got=1
                  break
                fi
                sleep 2
              done
              [ "$got" -eq 1 ] && break
            done
            if [ "$got" -eq 1 ]; then
              cp tmp.json "part-$n.json"
              n=$((n+1))
              regions=$((regions+1))
            fi
          done
          # ---------- OpenSky (OAuth2, kredity 4000/deň): celá Európa v jednom dotaze ----------
          if [ -n "$OPENSKY_ID" ] && [ -n "$OPENSKY_SECRET" ]; then
            TOKEN=$(curl -s --max-time 15 -X POST \
              "https://auth.opensky-network.org/auth/realms/opensky-network/protocol/openid-connect/token" \
              -d "grant_type=client_credentials" \
              -d "client_id=$OPENSKY_ID" \
              -d "client_secret=$OPENSKY_SECRET" | jq -r '.access_token // empty')
            if [ -n "$TOKEN" ]; then
              curl -sL --max-time 40 -H "Authorization: Bearer $TOKEN" \
                "https://opensky-network.org/api/states/all?lamin=34&lomin=-12&lamax=62&lomax=32" -o opensky.json
              if jq -e '.states | length' opensky.json > /dev/null 2>&1; then
                jq -c '{ac: [.states[] | select(.[5] != null and .[6] != null and .[8] == false) | {hex: .[0], flight: .[1], alt_baro: (if .[7] == null then null else (.[7] * 3.28084 | round) end), gs: (if .[9] == null then null else (.[9] * 1.94384 | round) end), track: .[10], baro_rate: (if .[11] == null then null else (.[11] * 196.85 | round) end), squawk: .[14], lat: .[6], lon: .[5]}]}' opensky.json > part-opensky.json
                echo "OpenSky: $(jq '.ac | length' part-opensky.json) lietadiel"
              else
                echo "OpenSky: odpoveď prázdna/chybná"
              fi
            else
              echo "OpenSky: token sa nepodarilo získať"
            fi
          else
            echo "OpenSky: secrets nie sú nastavené, preskakujem"
          fi
          if ! ls part-*.json > /dev/null 2>&1; then
            echo "VAROVANIE: všetky zdroje zlyhali, zostáva stará cache"
            exit 0
          fi
          jq -s '[.[] | (.ac // .aircraft)] | flatten | map(select(.lat != null)) | unique_by(.hex) | map({hex, flight, r, t, alt_baro, gs, track, baro_rate, squawk, emergency, category, lat, lon}) | {updated: (now|floor), ac: .}' part-*.json > sk.json
          echo "OK: $regions regionov, $(jq '.ac | length' sk.json) lietadiel"
          mkdir repo && cd repo
          git init -q
          git config user.name "skymonitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -q -b data
          mkdir -p data
          cp ../sk.json data/sk.json
          git add -A
          git commit -qm "data: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/petersoniq/skymonitor.git" data
